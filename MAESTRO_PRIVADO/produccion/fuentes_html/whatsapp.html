<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../lib/fuentes.css">
<style>
/* Captura de un cliente de mensajería en Android (tema claro, 2025). Sin logotipos. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:412px;height:914px;overflow:hidden;font-family:'roboto',sans-serif;-webkit-font-smoothing:antialiased;background:#fff}
#sb{position:absolute;left:0;right:0;top:0;height:28px;background:#fff;display:flex;align-items:center;padding:0 16px 0 20px;font-size:13.5px;font-weight:500;color:#1b1b1b;z-index:5}
#sb .r{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12.5px}
#ab{position:absolute;left:0;right:0;top:28px;height:60px;background:#fff;display:flex;align-items:center;padding:0 6px 0 4px;z-index:5;border-bottom:1px solid #ececec}
#ab .av{width:38px;height:38px;border-radius:50%;background:#dfe5e7;margin-left:2px;overflow:hidden;flex:none;display:flex;align-items:flex-end;justify-content:center}
#ab .tt{margin-left:10px;min-width:0;flex:1}
#ab .n{font-size:17px;font-weight:500;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ab .s{font-size:12.5px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#ab svg{flex:none}
#scroller{position:absolute;left:0;right:0;top:88px;bottom:70px;overflow:hidden;background:#efeae2}
#chat{padding:6px 0 10px}
.day{display:flex;justify-content:center;margin:8px 0 6px}
.day span{background:#fff;color:#54656f;font-size:12.5px;padding:5px 12px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.m{display:flex;margin:2px 10px}
.m.out{justify-content:flex-end}
.m.first{margin-top:8px}
.b{position:relative;max-width:82%;background:#fff;border-radius:8px;padding:6px 8px 7px 9px;box-shadow:0 1px .5px rgba(11,20,26,.13);font-size:15.2px;line-height:20.5px;color:#111b21}
.out .b{background:#d9fdd3}
.first.in .b{border-top-left-radius:0}
.first.out .b{border-top-right-radius:0}
.first.in .b::before{content:'';position:absolute;left:-8px;top:0;border-top:0 solid transparent;border-right:8px solid #fff;border-bottom:10px solid transparent}
.first.out .b::before{content:'';position:absolute;right:-8px;top:0;border-left:8px solid #d9fdd3;border-bottom:10px solid transparent}
.who{font-size:13.2px;font-weight:500;margin-bottom:1px;display:flex;gap:8px;align-items:baseline}
.who i{font-style:normal;color:#8696a0;font-weight:400;font-size:12.2px}
.t{float:right;margin:6px 0 -5px 10px;font-size:11.2px;color:#667781;display:flex;align-items:center;gap:3px;position:relative;top:2px}
.tx{white-space:pre-wrap;word-wrap:break-word}
.img{margin:-3px -5px 3px -6px;border-radius:6px;overflow:hidden;position:relative;width:258px}
.img img{display:block;width:100%;height:auto}
.img .ov{position:absolute;right:6px;bottom:4px;font-size:11px;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.6);display:flex;gap:3px;align-items:center}
.fw{font-size:12.2px;color:#8696a0;font-style:italic;display:flex;gap:4px;align-items:center;margin-bottom:2px}
.del{color:#8696a0;font-style:italic;display:flex;gap:5px;align-items:center}
.aud{display:flex;align-items:center;gap:8px;width:250px;padding:4px 0 2px}
.aud .wv{flex:1;height:26px;display:flex;align-items:center;gap:2px}
.aud .wv i{display:block;width:3px;border-radius:2px;background:#8fa3ad}
.aud .d{font-size:11.5px;color:#667781;position:absolute;left:52px;bottom:6px}
.sys{display:flex;justify-content:center;margin:6px 0}
.sys span{background:#ffeecd;color:#54656f;font-size:12.2px;padding:5px 10px;border-radius:7px;text-align:center;max-width:80%}
#in{position:absolute;left:0;right:0;bottom:22px;height:48px;background:#efeae2;display:flex;align-items:center;padding:0 6px;gap:6px}
#in .f{flex:1;height:44px;border-radius:24px;background:#fff;display:flex;align-items:center;padding:0 12px;gap:10px;color:#8696a0;font-size:16px;box-shadow:0 1px .5px rgba(11,20,26,.1)}
#in .mic{width:46px;height:46px;border-radius:50%;background:#1faa59;display:flex;align-items:center;justify-content:center}
#nav{position:absolute;left:0;right:0;bottom:0;height:22px;background:#efeae2;display:flex;align-items:center;justify-content:center}
#nav i{width:108px;height:4px;border-radius:2px;background:#1b1b1b;opacity:.8}
.emo{font-family:'Noto Color Emoji';font-size:.95em}
</style></head>
<body>
<div id="sb"><span id="hora">5:12</span><span class="r">
 <svg width="15" height="12" viewBox="0 0 15 12"><path d="M1 11h2V8H1zM5 11h2V6H5zM9 11h2V3H9zM13 11h2V0h-2z" fill="#1b1b1b"/></svg>
 <svg width="15" height="12" viewBox="0 0 16 12"><path d="M8 11.5 0 3.2A11.6 11.6 0 0 1 8 0a11.6 11.6 0 0 1 8 3.2z" fill="#1b1b1b"/></svg>
 <span id="bat">63%</span>
 <svg width="9" height="14" viewBox="0 0 9 14"><rect x="0.5" y="1.5" width="8" height="12" rx="1.5" fill="none" stroke="#1b1b1b"/><rect x="3" y="0" width="3" height="1.6" fill="#1b1b1b"/><rect id="batf" x="1.5" y="5.5" width="6" height="7" fill="#1b1b1b"/></svg>
</span></div>
<div id="ab">
 <svg width="30" height="24" viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z" fill="#3b4a54"/></svg>
 <div class="av" id="av"></div>
 <div class="tt"><div class="n" id="titulo"></div><div class="s" id="sub"></div></div>
 <svg width="26" height="24" viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11z" fill="none" stroke="#3b4a54" stroke-width="1.8"/></svg>
 <svg width="26" height="24" viewBox="0 0 24 24" style="margin-left:14px"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z" fill="none" stroke="#3b4a54" stroke-width="1.7"/></svg>
 <svg width="24" height="24" viewBox="0 0 24 24" style="margin-left:10px"><circle cx="12" cy="5" r="1.8" fill="#3b4a54"/><circle cx="12" cy="12" r="1.8" fill="#3b4a54"/><circle cx="12" cy="19" r="1.8" fill="#3b4a54"/></svg>
</div>
<div id="scroller"><div id="chat"></div></div>
<div id="in"><div class="f"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#8696a0" stroke-width="1.7"/><circle cx="9" cy="10" r="1.2" fill="#8696a0"/><circle cx="15" cy="10" r="1.2" fill="#8696a0"/><path d="M8 14.5c1.8 2 6.2 2 8 0" fill="none" stroke="#8696a0" stroke-width="1.6" stroke-linecap="round"/></svg><span style="flex:1">Mensaje</span>
 <svg width="22" height="22" viewBox="0 0 24 24"><path d="M16.5 6.5 8 15a2 2 0 0 0 2.8 2.8l8.5-8.5a4 4 0 0 0-5.7-5.7L5 12.2a6 6 0 0 0 8.5 8.5L20 14.2" fill="none" stroke="#8696a0" stroke-width="1.7" stroke-linecap="round"/></svg>
 <svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="#8696a0" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="#8696a0" stroke-width="1.7"/></svg></div>
 <div class="mic"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="#fff"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></div></div>
<div id="nav"><i></i></div>
<script>
const Q = new URLSearchParams(location.search);
const CHAT = Q.get('chat') || 'grupo';
const s = document.createElement('script');
s.src = `chat_${CHAT}.js`;
s.onload = pintar;
document.head.appendChild(s);

const TICKS = `<svg width="17" height="11" viewBox="0 0 17 11"><path d="M1 6l3 3 6-7.5M6.5 9l1 .9 6-7.5" fill="none" stroke="#53bdeb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const FW = `<svg width="14" height="12" viewBox="0 0 16 12"><path d="M10 0l6 5.5-6 5.5V7.7C5 7.7 2 9.3 0 12c.8-4.5 3.6-8 10-8.6z" fill="#8696a0"/></svg>`;
const BAN = `<svg width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#8696a0" stroke-width="2"/><path d="M5.6 5.6l12.8 12.8" stroke="#8696a0" stroke-width="2"/></svg>`;
function emo(t) { return t.replace(/(\p{Extended_Pictographic}(️|‍\p{Extended_Pictographic})*)/gu, '<span class="emo">$1</span>'); }
function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function pintar() {
  const D = window.DATA;
  document.getElementById('titulo').innerHTML = emo(D.titulo);
  document.getElementById('sub').textContent = D.sub;
  document.getElementById('hora').textContent = Q.get('hora') || D.hora || '5:12';
  document.getElementById('bat').textContent = (D.bat || 63) + '%';
  document.getElementById('av').innerHTML = D.avatar || `<svg width="38" height="38" viewBox="0 0 38 38"><circle cx="19" cy="15" r="6.5" fill="#fff"/><path d="M6 36c1.5-7 6.5-10.5 13-10.5S30.5 29 32 36z" fill="#fff"/></svg>`;
  let h = '', prev = null;
  D.m.forEach((m, i) => {
    const id = `m${i}`;
    if (m.day) { h += `<div class="day" id="${id}"><span>${m.day}</span></div>`; prev = null; return; }
    if (m.sys) { h += `<div class="sys" id="${id}"><span>${emo(esc(m.sys))}</span></div>`; prev = null; return; }
    const out = !!m.out;
    const first = !prev || prev !== (out ? '__yo' : m.from);
    prev = out ? '__yo' : m.from;
    const t = `<span class="t">${m.time}${out ? TICKS : ''}</span>`;
    let inner = '';
    if (!out && first && D.grupo) inner += `<div class="who" style="color:${D.colores[m.from] || '#1fa855'}">${esc(m.from)}${m.tel ? `<i>${m.tel}</i>` : ''}</div>`;
    if (m.fw) inner += `<div class="fw">${FW} Reenviado</div>`;
    if (m.img) inner += `<div class="img"><img src="${m.img}">${m.cap ? '' : `<span class="ov">${m.time}${out ? TICKS : ''}</span>`}</div>`;
    if (m.audio) {
      let bars = ''; let r = 7;
      for (let k = 0; k < 42; k++) { r = (r * 9301 + 49297) % 233280; bars += `<i style="height:${4 + (r / 233280) * 20 * (k < 38 ? 1 : 0.4)}px"></i>`; }
      inner += `<div class="aud"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#8696a0"/></svg><div class="wv">${bars}</div></div><span class="d">${m.audio}</span>`;
    }
    if (m.del) inner += `<span class="del">${BAN} ${m.del}</span>`;
    if (m.text) inner += `<span class="tx">${emo(esc(m.text))}</span>`;
    if (!m.img || m.cap || m.text) inner += t;
    else inner += '';
    h += `<div class="m ${out ? 'out' : 'in'} ${first ? 'first' : ''}" id="${id}"><div class="b" style="${m.img ? 'padding:3px 3px 5px 4px' : ''}">${inner}</div></div>`;
  });
  document.getElementById('chat').innerHTML = h;
  const imgs = [...document.images];
  Promise.all(imgs.map(im => im.complete ? 1 : new Promise(r => { im.onload = r; im.onerror = r; }))).then(() => { document.body.dataset.ready = '1'; });
}
</script>
</body></html>
