<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../lib/base.css">
<script src="../lib/filters.js"></script>
<script src="../lib/hand.js"></script>
<style>
/* Hoja tamaño carta, 48 px/cm: 1037 x 1339. Fotocopia de un original hecho en Word 97. */
#hoja{position:relative;width:1037px;height:1339px;background:#f8f8f5;overflow:hidden}
#tpl{position:absolute;inset:0;transform:rotate(-.45deg) translate(6px,4px);transform-origin:50% 50%;filter:url(#copia)}
.marco{position:absolute;left:58px;top:58px;right:58px;bottom:58px;border:3px solid #202020;outline:1px solid #202020;outline-offset:5px}
.enc{position:absolute;left:84px;right:84px;top:82px;font:400 17px 'comic-neue';color:#1c1c1c;display:flex;justify-content:space-between}
.tit{position:absolute;left:84px;right:84px;top:122px;text-align:center;font:700 38px 'comic-neue';letter-spacing:1px;color:#141414}
.sub{position:absolute;left:84px;right:84px;top:172px;text-align:center;font:400 20px 'comic-neue';color:#1c1c1c}
.reloj{position:absolute;right:92px;top:108px;width:74px;height:98px}
.campo{position:absolute;font:700 19px 'comic-neue';color:#1a1a1a}
.lin{position:absolute;height:0;border-top:1.4px solid #3a3a3a}
.pie{position:absolute;left:84px;right:84px;bottom:78px;text-align:center;font:italic 400 16px 'comic-neue';color:#222}
#txt{position:absolute;inset:0}
.w{position:absolute;white-space:nowrap}
body.solo-texto #hoja{background:transparent}
body.solo-texto #tpl{display:none}
body.solo-plantilla #txt{display:none}
.oi{position:relative}
.oi::after{content:'';position:absolute;left:28%;top:-.02em;width:.2em;height:.2em;border:1.6px solid currentColor;border-radius:50%;background:#f8f8f5}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="copia"><feGaussianBlur stdDeviation="0.45"/><feComponentTransfer><feFuncR type="linear" slope="1.08" intercept="-0.02"/><feFuncG type="linear" slope="1.08" intercept="-0.02"/><feFuncB type="linear" slope="1.08" intercept="-0.02"/></feComponentTransfer></filter>
</defs></svg>
<div id="hoja">
 <div id="tpl">
  <div class="marco"></div>
  <div class="enc"><span>Esc. Prim. "Margarita Maza de Juárez" T.M.</span><span>Ciclo escolar 1999-2000</span></div>
  <svg class="reloj" viewBox="0 0 74 98" fill="none" stroke="#1d1d1d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
   <path d="M8 6 H66 M8 92 H66"/><path d="M13 7 C13 34 34 40 37 49 C40 58 61 64 61 91"/><path d="M61 7 C61 34 40 40 37 49 C34 58 13 64 13 91"/>
   <path d="M22 26 C28 32 46 32 52 26" stroke-width="1.4"/><path d="M20 88 C24 76 50 76 54 88" stroke-width="1.4"/><path d="M37 50 V74" stroke-width="1" stroke-dasharray="2 4"/>
   <path d="M5 3 V10 M69 3 V10 M5 88 V95 M69 88 V95" stroke-width="3"/>
  </svg>
  <div class="tit">MI CARTA PARA EL AÑO 2025</div>
  <div class="sub">Cápsula del tiempo · 6° "B"</div>
  <div class="campo" style="left:84px;top:236px">Nombre:</div><div class="lin" style="left:170px;top:258px;width:470px"></div>
  <div class="campo" style="left:660px;top:236px">Fecha:</div><div class="lin" style="left:730px;top:258px;width:222px"></div>
  <div id="preg"></div>
  <div class="pie">Esta carta se abrirá en el año 2025. ¡Escribe con tu mejor letra!</div>
 </div>
 <div id="txt"></div>
</div>
<script>
// Plantilla: 5 apartados. Cada uno: título y 4 renglones de 38 px.
const PREG = ['1. Así soy yo:', '2. Lo que más me gusta:', '3. Mi familia:', '4. Lo que quiero ser de grande:', '5. Un mensaje para el futuro:'];
const Y0 = 296, BLOQUE = [3, 3, 3, 2, 6], RENG = 37;
let y = Y0; const pos = [];
let html = '';
PREG.forEach((p, i) => {
  html += `<div class="campo" style="left:84px;top:${y}px">${p}</div>`;
  const rs = [];
  for (let k = 0; k < BLOQUE[i]; k++) {
    const yy = y + 30 + RENG * (k + 1) - 8;
    html += `<div class="lin ${k === 0 ? 'l0' : ''}" style="left:84px;top:${yy}px;right:84px"></div>`;
    rs.push(yy);
  }
  pos.push(rs);
  y += 30 + RENG * BLOQUE[i] + 16;
});
document.getElementById('preg').innerHTML = html;
window.RENGLONES = pos;
// El primer renglón empieza después del título del apartado (medido, no estimado).
const ANCHO = [];
document.querySelectorAll('#preg .campo').forEach((c, i) => { ANCHO.push(c.getBoundingClientRect().width); });
document.querySelectorAll('#preg .l0').forEach((l, i) => { l.style.left = (84 + ANCHO[i] + 10) + 'px'; });

const Q = new URLSearchParams(location.search);
const KID = Q.get('kid') || 'oscar';
if (Q.get('modo') === 'texto') document.body.classList.add('solo-texto');
if (Q.get('modo') === 'plantilla') document.body.classList.add('solo-plantilla');

// Contenido de cada carta: [nombre, fecha, [apartado1 renglones], ...]
const C = {
 oscar: { f: 'swanky-and-moo-moo', s: 29, cls: 'gel-green', seed: 20, n: 'Óscar Mendoza Luévano', d: '16 de junio del 2000',
  a: [['Tengo 12 años, soy moreno, uso lentes', 'desde 4° y soy de las Chivas!!'],
      ['el fut, dibujar carros, el Nintendo de mi', 'primo y los tacos de mi tía Cuca.'],
      ['mi mamá Rosa, mi papá Toño que es', 'chofer y mi hermano el Chuy que es mas chico.'],
      ['Ingeniero en electrónica', '(o portero de las Chivas).'],
      ['En el 2025 voy a tener 37 años. Ojalá las Chivas', 'ya sean campeones otra vez y que yo tenga', 'un carro y una casa. Si alguien lee esto', 'y no soy yo, no se burle.', 'P.D. Lo que mas me gustó de 6° fue el gato.']] },
 itza: { f: 'indie-flower', s: 29, cls: 'gel-green', seed: 31, n: 'Itzayana Ibarra Delgado', d: '16 de junio del 2000',
  a: [['Tengo 11 años, soy morena, tengo el pelo largo', 'y soy muy platicadora (dice la maestra jaja).'],
      ['Cantar, Pikachu, mi perro Canelo y', 'las papitas con chile.'],
      ['Mi mamá, mi papá, mi hermana la Yesi', 'y mi abuelita que vive con nosotros.'],
      ['Veterinaria o cantante.'],
      ['Hola Itza del 2025!! Ojalá ya seas', 'veterinaria y tengas muchos perritos.', 'No te olvides de tus amigas del 6° B.', 'Te quiero mucho.   Itza ♥']] },
 beto: { f: 'covered-by-your-grace', s: 30, cls: 'bic-blue', seed: 42, n: 'Roberto Macías Ávila', d: '16 de junio del 2000',
  a: [['Soy alto, flaco, me dicen Beto y soy', 'el mejor portero del salón.'],
      ['El fut, el Nintendo, las luchas y dormir.'],
      ['Mi papá trabaja en la Nissan, mi mamá vende', 'por catálogo y tengo dos hermanos.'],
      ['Futbolista o bombero.'],
      ['Beto del 2025: si ya eres futbolista cómprate', 'un carro rojo. Si no, ni modo.', 'Saludos a la raza del 6° B.']] },
 karla: { f: 'bad-script', s: 25, cls: 'gel-purple', seed: 53, n: 'Karla Patricia Díaz de León P.', d: '16 de junio del 2000',
  a: [['Tengo 12 años, soy seria pero cuando agarro', 'confianza no me callo. Uso frenos.'],
      ['Leer, ver las novelas con mi mamá, dibujar', 'y el chocolate.'],
      ['Mi mamá es enfermera, mi papá es contador y', 'tengo un hermanito que se llama Pablo.'],
      ['Doctora (pediatra).'],
      ['Querida Karla: espero que hayas cumplido', 'tus sueños y que sigas siendo amiga de Mariana', 'y de Nayeli. Cuida a Pablo. No te enojes tanto.']] },
 eduardo: { f: 'handlee', s: 26, cls: 'bic-blue', seed: 64, n: 'Eduardo Medina Castañeda', d: '16 de junio del 2000',
  a: [['Me llamo Eduardo, tengo 11 años, soy', 'chaparro y me gusta mucho la ciencia.'],
      ['Los experimentos, armar cosas, las caricaturas', 'y el pozole de mi abuela.'],
      ['Mi mamá, mi abuela y yo.'],
      ['Científico o maestro de ciencias.'],
      ['Eduardo: ojalá ya existan los carros que vuelan.', 'Si no, invéntalos tú. Y no te pelees', 'con mi mamá.']] },
 gaby: { f: 'gloria-hallelujah', s: 24, cls: 'pencil', seed: 75, n: 'Gabriela Morales Esparza', d: '16 de junio del 2000',
  a: [['Me llamo Gaby, tengo 11 años y soy la más', 'chiquita de mi casa.'],
      ['Bailar, cantar con mis primas, mi tamagochi', '(ya se murió) y el elote con mayonesa.'],
      ['Somos 6: mi papá, mi mamá, mis 3', 'hermanas y yo.'],
      ['Maestra de kínder.'],
      ['Gaby del futuro: no se te olvide tu cumpleaños', 'y hazte una fiesta grande. Y acuérdate de', 'la maestra Chayo que fue muy buena.']] },
};
const k = C[KID];
function linea(x, yb, t, extra = '') {
  return `<div class="w hw ${k.cls}" data-seed="${k.seed + Math.round(yb)}" data-jit="1.1" style="left:${x}px;top:${yb - k.s * 1.02}px;font-family:'${k.f}';font-size:${k.s}px;${extra}"><span class="ln">${t}</span></div>`;
}
let T = '';
T += linea(180, 256, k.n);
T += linea(738, 256, k.d, `font-size:${k.s * 0.86}px`);
k.a.forEach((reng, i) => {
  reng.forEach((t, j) => {
    const x = j === 0 ? 84 + ANCHO[i] + 18 : 96;
    T += linea(x, pos[i][j] - 2, t);
  });
});
const tx = document.getElementById('txt');
tx.innerHTML = T;
if (k.oi) {
  // Itzayana pone círculos en vez de puntos sobre las íes: se marcan después del render.
  tx.querySelectorAll('.w').forEach(w => { w.innerHTML = w.innerHTML.replace(/i/g, '<span class="oi">ı</span>'); });
}
</script>
</body></html>
