<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../lib/base.css">
<script src="../lib/filters.js"></script>
<script src="../lib/hand.js"></script>
<style>
/* Cuaderno profesional de cuadro chico (5 mm), 20.5 x 27 cm a 48 px/cm, espiral a la izquierda. */
#hoja{position:relative;width:1044px;height:1296px;overflow:hidden;background:transparent}
.pap{position:absolute;left:60px;top:0;width:984px;height:1296px;background-color:#f6f5ef;
 background-image:linear-gradient(#b9c6d3 1px,transparent 1px),linear-gradient(90deg,#b9c6d3 1px,transparent 1px);
 background-size:24px 24px;background-position:0 12px}
.hole{position:absolute;left:78px;width:14px;height:22px;border-radius:7px;background:#3b3530}
.coil{position:absolute;left:18px;width:84px;height:26px}
.w{position:absolute;white-space:nowrap}
.cur{font-family:'cedarville-cursive'}
.pegado{position:absolute;background:#fbfaf6;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.cell{position:absolute;border:1.6px solid #2a3e87;border-radius:3px}
</style></head>
<body>
<div id="hoja"><div class="pap" id="pap"></div></div>
<script>
const Q = new URLSearchParams(location.search);
const PAG = Q.get('pag') || 'lista';
const hoja = document.getElementById('hoja');
let h = '';
// espiral
for (let y = 22; y < 1296; y += 38) {
  h += `<div class="hole" style="top:${y}px"></div>`;
  h += `<svg class="coil" style="top:${y - 2}px" viewBox="0 0 84 26"><path d="M66 13 C 50 -2, 10 -2, 4 13 C 10 26, 50 26, 66 13" fill="none" stroke="#8d9096" stroke-width="3.2"/><path d="M66 13 C 50 -1, 12 0, 6 12" fill="none" stroke="#d7d9dd" stroke-width="1.2"/></svg>`;
}
function W(x, y, t, o = {}) {
  const f = o.f || 'cedarville-cursive', s = o.s || 25, cls = o.cls || 'ink-blue';
  return `<div class="w hw ${cls}" data-seed="${o.seed || Math.round(x * 3 + y * 7)}" data-jit="${o.j || 0.8}" data-slope="0.35" style="left:${x}px;top:${y - s}px;font-family:'${f}';font-size:${s}px;${o.css || ''}"><span class="ln">${t}</span></div>`;
}
const LISTA = ['Ávila Romo José Luis','Castañeda Luévano Diana Laura','Chávez Medina Juan Carlos','De Luna Esparza Adriana','Delgado Ruiz Brenda Yesenia','Díaz de León Padilla Karla Patricia','Durón Salas Luis Fernando','Esparza Reyes Mariana','Flores Tiscareño Érick','García Velasco Ana Karen','González Campos Christian Alejandro','Guerrero López Nancy Guadalupe','Hernández Martínez Miguel Ángel','Ibarra Delgado Itzayana','Jiménez Serna Jorge Alberto','López Romo Fabiola','Macías Ávila Roberto','Martínez Durón Claudia Ivonne','Medina Castañeda Eduardo','Mendoza Luévano Óscar','Morales Esparza Gabriela','Muñoz Chávez Ricardo','Ortiz Lozano Daniel','Padilla Hernández Verónica','Ramírez Torres Francisco Javier','Reyes Macías Lizbeth','Romo Salas Alejandro','Ruvalcaba Ortiz Kevin Omar','Salas De Luna Mónica','Serna Guerrero Paola','Tiscareño Flores Jessica','Torres Medina Sandra Luz','Velasco Jiménez Arturo','Zamarripa Díaz Nayeli'];
let p = '';
function tick(x, y, i) {
  const a = (i * 13 % 7) - 3, b = (i * 7 % 5) - 2;
  return `<svg style="position:absolute;left:${x}px;top:${y}px;overflow:visible" width="30" height="26"><path class="ink-red" d="M2 ${13 + b} C 5 16, 8 19, 10 ${22 + b} C 14 14, 19 7, ${27 + a} 1" fill="none" stroke="#c0262d" stroke-width="2.3" stroke-linecap="round" style="filter:url(#ink)"/></svg>`;
}
if (PAG === 'lista') {
  p += W(100, 70, '6° "B"', { s: 36, seed: 11 });
  p += W(520, 66, 'Ciclo escolar 1999 - 2000', { s: 27, seed: 12 });
  p += W(260, 118, 'Relación de alumnos', { s: 33, seed: 13 });
  p += `<svg style="position:absolute;left:250px;top:124px" width="320" height="12"><path d="M2 6 C 90 3, 200 9, 316 4" fill="none" stroke="#213d8f" stroke-width="2" style="filter:url(#ink)"/></svg>`;
  p += W(760, 160, 'Carta 2025', { s: 21, cls: 'ink-red', seed: 14 });
  p += W(790, 184, '16/jun', { s: 19, cls: 'ink-red', seed: 15 });
  LISTA.forEach((n, i) => {
    const y = 214 + i * 30;
    p += W(62, y, String(i + 1) + '.', { s: 22, seed: 100 + i, j: 0.6, css: 'width:40px;text-align:right' });
    p += W(112, y, n, { s: 23, seed: 200 + i, j: 0.75 });
    p += tick(818 + (i * 37 % 9), y - 22, i);
  });
  p += W(112, 1256, '34 alumnos: 18 niñas, 16 niños', { s: 21, seed: 21 });
  p += W(640, 1256, 'Total 34 cartas', { s: 21, cls: 'ink-red', seed: 22 });
  p += tick(818, 1234, 99);
}

if (PAG === 'croquis') {
  p += W(90, 64, 'Acomodo del grupo  6° "B"', { s: 32, seed: 31 });
  p += W(640, 62, 'sept. 1999', { s: 25, seed: 32 });
  // pizarrón y escritorio
  p += `<div class="cell" style="left:230px;top:96px;width:520px;height:34px"></div>`;
  p += W(410, 124, 'Pizarrón', { s: 24, seed: 33 });
  p += `<div class="cell" style="left:560px;top:150px;width:150px;height:44px"></div>`;
  p += W(572, 180, 'escritorio', { s: 20, seed: 34 });
  p += W(800, 124, 'Puerta', { s: 22, seed: 35 });
  p += `<svg style="position:absolute;left:880px;top:92px" width="40" height="80"><path d="M6 4 L6 74 M6 4 C 34 12, 34 60, 6 74" fill="none" stroke="#213d8f" stroke-width="2" style="filter:url(#ink)"/></svg>`;
  // ventanas a la izquierda (4)
  p += W(16, 214, 'Ventanas', { s: 21, seed: 36, css: 'transform:rotate(-90deg);transform-origin:0 0;top:820px' });
  [[104, 226], [326, 462], [552, 686], [848, 982]].forEach(([a, b]) => {
    p += `<svg style="position:absolute;left:52px;top:${a}px" width="22" height="${b - a + 4}"><path d="M4 2 L4 ${b - a} M14 2 L14 ${b - a} M4 2 L14 2 M4 ${b - a} L14 ${b - a}" fill="none" stroke="#213d8f" stroke-width="1.8" style="filter:url(#ink)"/></svg>`;
  });
  const F = [
    ['Adriana', 'Miguel Á.', 'Óscar M.', 'Lizbeth', 'Arturo V.', 'Érick'],
    ['Diana', 'José Luis', 'Nancy', 'Ricardo', 'Sandra', 'Daniel'],
    ['Mariana', 'Juan Carlos', 'Fabiola', 'Christian', 'Mónica', 'Fco. Javier'],
    ['Karla', 'Luis Fdo.', 'Itzayana', 'Jorge A.', 'Kevin R.', 'Alejandro'],
    ['Brenda', 'Eduardo', 'Ana Karen', 'Roberto', 'Verónica', 'Paola'],
    ['Claudia', 'Gabriela', 'Jessica', 'Nayeli', '', ''],
  ];
  F.forEach((col, c) => col.forEach((n, r) => {
    const x = 96 + c * 146, y = 240 + r * 170;
    p += `<div class="cell" style="left:${x}px;top:${y}px;width:124px;height:70px"></div>`;
    if (!n) return;
    const tach = (c === 0 && r === 2) || (c === 3 && r === 4);
    p += W(x + 8, y + 42, n, { s: 22, seed: 400 + c * 10 + r, css: tach ? 'opacity:.9' : '' });
    if (tach) {
      p += `<svg style="position:absolute;left:${x + 4}px;top:${y + 20}px" width="118" height="30"><path d="M2 20 C 30 14, 70 22, 114 10 M4 12 C 40 20, 80 8, 112 18" fill="none" stroke="#141418" stroke-width="2" style="filter:url(#ink)"/></svg>`;
      p += W(x + 10, y + 66, c === 0 ? 'Kevin R.' : 'Óscar M.', { s: 21, cls: 'bic-black', f: 'cedarville-cursive', seed: 470 + c });
    }
  }));
  p += W(180, 1250, 'cambio 9/mar', { s: 21, cls: 'bic-black', seed: 480 });
  p += `<svg style="position:absolute;left:230px;top:990px;overflow:visible" width="10" height="10"></svg>`;
  // anotación roja del vidrio junto a la 3a ventana
  p += W(104, 536, 'vidrio estrellado 13/oct', { s: 20, cls: 'ink-red', seed: 490 });
  p += `<svg style="position:absolute;left:70px;top:528px;overflow:visible" width="40" height="70"><path d="M34 6 C 22 12, 14 28, 6 56 M6 56 l-2 -10 M6 56 l8 -6" fill="none" stroke="#c0262d" stroke-width="2.2" stroke-linecap="round" style="filter:url(#ink)"/></svg>`;
}
if (PAG.startsWith('diario')) {
  const PAGS = {
    diario_oct: [
      ['Lun. 11/oct/99', ['Honores (le tocó al 5° A). Esp.: el cuento, elementos.', 'Mat.: fracciones equivalentes, ejercicios págs. 30-31.']],
      ['Mar. 12/oct/99', ['Día de la Raza. Periódico mural a cargo de la fila 3.']],
      ['Mié. 13/oct/99', ['Amaneció estrellado el vidrio de la 3a. ventana', '(fila de las ventanas). Ya estaba así al llegar:', 'fue en la tarde (T.V.). Se reportó a Dirección.', 'El conserje lo tapó con cinta. Cuidar esa fila.', 'Esp.: lectura en voz alta págs. 42-45.']],
      ['Jue. 14/oct/99', ['Examen de Historia (Independencia). Faltaron 2.']],
      ['Vie. 15/oct/99', ['Junta con padres de familia. Asistieron 29.', 'Cooperación para el festival de invierno.']],
    ],
    diario_feb: [
      ['Jue. 3/feb/2000', ['Mat.: perímetro y área. Tarea: problemas pág. 88.']],
      ['Lun. 7/feb/2000', ['Se presentó al grupo el proyecto "Carta al 2025"', '(cápsula del tiempo, por el cambio de milenio).', 'Muy entusiasmados. Se enterrará a fin de ciclo', 'junto al pirul. Pedir permiso a Dirección', 'y conseguir caja de plástico con tapa.']],
      ['Mar. 8/feb/2000', ['Ciencias: el aparato respiratorio. Maqueta en equipos.']],
      ['Jue. 10/feb/2000', ['La Directora autorizó la cápsula. Los papás de', 'Eduardo M. donan la caja.']],
    ],
    diario_mar: [
      ['Mié. 8/mar/2000', ['Repaso para el bimestral. Geografía: continentes.']],
      ['Jue. 9/mar/2000', ['Kevin R. y Roberto M. sacaron de la canastilla de un', 'mesabanco de la fila de las ventanas unos recaditos', 'de una niña del turno de la tarde y los leyeron en', 'voz alta. Burlas y alboroto. Les pedí devolverlos a', 'su dueño. Se habló con el grupo sobre el respeto a lo', 'ajeno. Informé a la Directora (Profra. Villalobos)', 'para que lo vea con la Dirección del T.V.', 'Cambio de lugares (ver croquis).']],
      ['Vie. 10/mar/2000', ['La Directora habló con el conserje y con la', 'Dirección de la tarde. Asunto arreglado.']],
      ['Lun. 13/mar/2000', ['Examen bimestral (Esp. y Mat.).']],
    ],
    diario_jun: [
      ['Mié. 14/jun/2000', ['Ensayo de la ceremonia de fin de cursos.', 'Esp.: la carta formal (repaso).']],
      ['Vie. 16/jun/2000', ['Cartas al 2025: se escribieron en clase en la hoja', 'fotocopiada. Cada alumno cerró su sobre.', '34 alumnos, 34 sobres. Al archivero con llave.']],
      ['Lun. 19/jun/2000', ['Entrega de calificaciones del 5o. bimestre.']],
      ['Vie. 23/jun/2000', ['Ceremonia de la cápsula del tiempo, 11:00. Asistieron', 'padres y la Directora. Se enterró la caja junto', 'al pirul del patio de atrás; el conserje nuevo', 'hizo el hoyo. Salió muy bonito.']],
    ],
  };
  const E = PAGS[PAG];
  let y = 70;
  E.forEach(([f, ls], i) => {
    p += W(88, y, f, { s: 25, seed: 600 + i * 17 });
    p += `<svg style="position:absolute;left:84px;top:${y + 4}px" width="200" height="8"><path d="M2 4 C 60 2, 120 6, 190 3" fill="none" stroke="#213d8f" stroke-width="1.6" style="filter:url(#ink)"/></svg>`;
    y += 42;
    ls.forEach((l, k) => { p += W(100, y, l, { s: 23, seed: 700 + i * 31 + k }); y += 36; });
    y += 26;
  });
}

document.getElementById('pap').innerHTML = p;
hoja.insertAdjacentHTML('beforeend', h);
</script>
</body></html>
