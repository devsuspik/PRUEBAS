<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../lib/base.css">
<script src="../lib/filters.js"></script>

<style>
/* Lista de asistencia impresa (Word, Arial) y llenada a mano. Carta vertical a 48 px/cm. */
#hoja{position:relative;width:1037px;height:1339px;background:#fbfbf8;overflow:hidden}
.enc{position:absolute;left:70px;right:70px;top:56px;text-align:center;font-family:'arimo';color:#111}
.enc .a{font-size:17px;font-weight:700}
.enc .b{font-size:22px;font-weight:700;margin-top:6px}
.enc .c{font-size:16px;margin-top:4px}
table{position:absolute;left:62px;top:196px;width:913px;border-collapse:collapse;font-family:'arimo';font-size:14px;color:#111}
th{border:1.4px solid #222;background:#d9d9d9;padding:5px 4px;font-weight:700;text-align:center}
td{border:1.2px solid #333;height:36.5px;padding:0 4px;vertical-align:middle}
td.n{text-align:center;width:40px}
.w{position:absolute;white-space:nowrap}
.tapa{position:absolute;background:#0d0d0d;display:none}
body.mascara #hoja{background:#fff}
body.mascara #hoja > *:not(#esc){visibility:hidden}
body.mascara #esc > *{visibility:hidden}
body.mascara .tapa{display:block;visibility:visible!important}
</style></head>
<body>

 <div class="enc"><div class="a">ESC. PRIM. "MARGARITA MAZA DE JUÁREZ" T.M.</div>

document.getElementById('tb').innerHTML = tb;
let e = '';

document.getElementById('esc').innerHTML = e;
if (new URLSearchParams(location.search).get('mascara')) document.body.classList.add('mascara');
</script>
</body></html>
